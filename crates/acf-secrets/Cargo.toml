[package]
name = "acf-secrets"
description = "Runtime SecretProvider and administrative SecretAdmin traits, protected secret types, and the in-memory provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# In-memory provider for tests and the `development` deployment profile.
# Release builds must not enable it (design §13.4).
in-memory = []
# Reusable provider conformance suite for provider adapters' tests.
conformance = []

[dependencies]
async-trait.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[[test]]
name = "in_memory_provider"
required-features = ["in-memory", "conformance"]

[lints]
workspace = true

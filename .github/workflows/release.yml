name: Release

# A `v*` tag builds, smoke-tests, packages, and publishes release binaries.
# A manual run does everything except publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The binaries link against the build host's glibc. Building on the oldest
    # supported distribution, Ubuntu 20.04 (glibc 2.31), keeps them running
    # there and on everything newer. GitHub retired its 20.04 runners, so the
    # build runs in the 20.04 container image.
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl git jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - name: Read the workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "acf-gateway") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME"
      # Smoke tests first: they enable test-only features of dev-dependencies,
      # so the shipped binaries are rebuilt cleanly afterwards.
      - name: Smoke-test the release flavor
        run: |
          cargo build --release --locked -p acf-control-plane -p acf-agent
          cargo test --release --locked -p acf-gateway --test setup --test production
      - name: Build release binaries
        run: cargo build --release --locked -p acf-gateway -p acf-control-plane -p acf-agent
      - name: Package
        run: scripts/package-release.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "ACF $GITHUB_REF_NAME" --notes-file docs/releases/v1.0.0.md $prerelease

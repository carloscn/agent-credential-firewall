# cargo-deny policy. Run with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only. Adding a license here requires review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are unpublished (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Core crates must not depend on a concrete secret provider.
    # Only the gateway composition root may link the encrypted local provider.
    { crate = "acf-provider-local", wrappers = ["acf-gateway"], reason = "core crates must stay provider-neutral" },
    # Secret material stays out of the protocol, daemon, control plane, policy,
    # state, and audit crates; responses then cannot carry it.
    { crate = "acf-secrets", wrappers = ["acf-config", "acf-connectors", "acf-provider-local", "acf-gateway"], reason = "only these crates may handle secret material" },
    # TLS goes through rustls (design §19.3).
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

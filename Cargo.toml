[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.92"
publish = false
license = "Apache-2.0"
repository = "https://github.com/carloscn/agent-credential-firewall"

# Internal crates. Dependency direction is documented in
# docs/implementation-plan.md §5 and enforced for providers in deny.toml.
[workspace.dependencies]
acf-agent = { path = "crates/acf-agent" }
acf-audit = { path = "crates/acf-audit" }
acf-config = { path = "crates/acf-config" }
acf-connectors = { path = "crates/acf-connectors" }
acf-control-plane = { path = "crates/acf-control-plane" }
acf-e2e = { path = "crates/acf-e2e" }
acf-gateway = { path = "crates/acf-gateway" }
acf-identity = { path = "crates/acf-identity" }
acf-policy = { path = "crates/acf-policy" }
acf-protocol = { path = "crates/acf-protocol" }
acf-provider-local = { path = "crates/acf-provider-local" }
acf-secrets = { path = "crates/acf-secrets" }
acf-state = { path = "crates/acf-state" }

# External crates. Direct dependencies adopt a release only after it has been
# published for at least two weeks, unless a newer release fixes a RustSec
# advisory (tokio 1.53.3 fixes RUSTSEC-2026-0386). Transitive versions are
# whatever Cargo resolves; cargo-deny and cargo-audit gate them on advisories,
# licenses, and sources.
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0.21"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
url = "2.5.8"
zeroize = "1.9.1"
tokio = { version = "1.53.3", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panicking and debugging shortcuts are not acceptable in a credential gateway.
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
# Direct printing bypasses redaction; output must go through tracing or audit sinks.
print_stderr = "warn"
print_stdout = "warn"
mem_forget = "warn"

[profile.release]
overflow-checks = true
